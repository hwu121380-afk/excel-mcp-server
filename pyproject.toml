[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-mcp-server"
version = "0.1.0"
description = "MCP server that lets AI coding agents inspect, merge, clean and convert Excel and CSV files."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anghuw" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0,<2",
    "openpyxl>=3.1",
]

[project.scripts]
excel-mcp-server = "excel_mcp_server.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
